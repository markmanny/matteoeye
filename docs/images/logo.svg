<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="MatteoEye logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1f2b"/>
      <stop offset="1" stop-color="#0b0d12"/>
    </linearGradient>
    <radialGradient id="iris" cx="0.42" cy="0.38" r="0.7">
      <stop offset="0" stop-color="#93c5fd"/>
      <stop offset="0.45" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </radialGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="253" height="253" rx="54.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>
  <!-- eye outline -->
  <path d="M28 128 C 62 72, 194 72, 228 128 C 194 184, 62 184, 28 128 Z" fill="#0f1115" stroke="#3b82f6" stroke-width="10" stroke-linejoin="round"/>
  <!-- iris and pupil (camera lens) -->
  <circle cx="128" cy="128" r="40" fill="url(#iris)"/>
  <circle cx="128" cy="128" r="17" fill="#0b0d12"/>
  <circle cx="114" cy="113" r="7" fill="#ffffff" fill-opacity="0.9"/>
  <!-- recording dot -->
  <circle cx="204" cy="56" r="17" fill="#ef4444"/>
  <circle cx="204" cy="56" r="17" fill="none" stroke="#0b0d12" stroke-width="5"/>
</svg>
